# Put this file in your repo as .github/workflows/build.yml, next to PDM-Source.zip (repo root).
# It unpacks the zip, builds PDM on a Windows runner and publishes PDM-Windows.zip as a downloadable artifact.
name: Build PDM

on:
  workflow_dispatch:   # the "Run workflow" button on the Actions tab
  push:
    paths: ["PDM-Source.zip", ".github/workflows/build.yml"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unpack sources
        shell: pwsh
        run: Expand-Archive PDM-Source.zip -DestinationPath . -Force

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build (Rust engine + host, Flutter UI, stage dist)
        shell: pwsh
        working-directory: pdm
        run: powershell -ExecutionPolicy Bypass -File scripts\build.ps1

      - name: Run Rust tests
        shell: pwsh
        working-directory: pdm
        continue-on-error: true   # report failures in the log without blocking the download
        run: cargo test --workspace

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path pdm\dist\* -DestinationPath PDM-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PDM-Windows
          path: PDM-Windows.zip
          retention-days: 14
